<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>25 March</title>

<style>
body{
  margin:0;
  background:#0d0d16;
  color:white;
  font-family:'Segoe UI', sans-serif;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity 1.2s ease;
}

.hidden{
  opacity:0;
  pointer-events:none;
}

h1{
  font-size:45px;
}

button{
  padding:12px 28px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  background:#ff4f81;
  color:white;
  transition:0.3s;
}

button:hover{
  background:#ff2e6c;
}

.box{
  font-size:90px;
  cursor:pointer;
  transition:0.3s;
}
.box:hover{
  transform:scale(1.1);
}

.glow{
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #ff4f81; }
  to{ text-shadow:0 0 40px #ff2e6c; }
}

.stars{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(white 1px, transparent 1px);
  background-size:40px 40px;
  opacity:0.08;
  animation:move 40s linear infinite;
}

@keyframes move{
  from{background-position:0 0;}
  to{background-position:0 1000px;}
}

.confetti{
  position:absolute;
  font-size:22px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

.slideshow img{
  width:220px;
  height:300px;
  object-fit:cover;
  border-radius:20px;
  box-shadow:0 0 20px rgba(255,255,255,0.3);
  margin-top:20px;
  display:none;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen">
  <h1>📦 A Midnight Delivery...</h1>
  <p>To: Kajal</p>
  <p>25 March • 00:00</p>
  <button onclick="openGift()">Open</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen hidden">
  <div class="box" onclick="reveal()">🎁</div>
  <p>Tap to open</p>
</div>

<!-- SCREEN 3 -->
<div id="screen3" class="screen hidden">
  <div class="stars"></div>
  <h1 class="glow">Happy Birthday Kajal 🎂</h1>
  <p>Out of 8 billion people...</p>
  <p>25th March chose someone rare.</p>
  <p>And I’m lucky she chose me too.</p>
  <p style="margin-top:25px;">— Brijesh</p>

  <div class="slideshow">
    <img src="pic1.jpg" id="img1">
    <img src="pic2.jpg" id="img2">
    <img src="pic3.jpg" id="img3">
  </div>
</div>

<audio id="bgMusic" src="music.mp3" loop></audio>
<audio id="heartbeat" src="heartbeat.mp3"></audio>

<script>

function openGift(){
  document.getElementById("screen1").classList.add("hidden");
  setTimeout(()=>{
    document.getElementById("screen2").classList.remove("hidden");
  },1000);
}

function reveal(){
  document.getElementById("screen2").classList.add("hidden");

  let heartbeat = document.getElementById("heartbeat");
  heartbeat.play();

  setTimeout(()=>{
    document.getElementById("screen3").classList.remove("hidden");
    document.getElementById("bgMusic").play();
    createConfetti();
    startSlideshow();
  },2500);
}

function createConfetti(){
  for(let i=0;i<70;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.innerHTML=["🎉","🎊","✨","🎈"][Math.floor(Math.random()*4)];
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+3)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),6000);
  }
}

function startSlideshow(){
  let images=["img1","img2","img3"];
  let index=0;
  setInterval(()=>{
    document.querySelectorAll(".slideshow img").forEach(img=>img.style.display="none");
    document.getElementById(images[index]).style.display="block";
    index=(index+1)%images.length;
  },3000);
}

</script>

</body>
</html>
