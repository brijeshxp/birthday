<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> HBD Kajal</title>

<style>
body{
  margin:0;
  background:#0d0d16;
  color:white;
  font-family:'Segoe UI', sans-serif;
  text-align:center;
  overflow-x:hidden;
}

.screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px 20px;
  position:relative;
}

.hidden{
  display:none;
}

h1{
  font-size:36px;
  margin-bottom:20px;
  transition:all 1.5s ease;
}

p{
  font-size:20px;
  margin:8px 0;
}

button{
  margin-top:25px;
  padding:14px 32px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#ff4f81;
  color:white;
  cursor:pointer;
}

.box{
  font-size:100px;
  cursor:pointer;
  margin-bottom:20px;
}

.glow{
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #ff4f81; }
  to{ text-shadow:0 0 40px #ff2e6c; }
}

.bigTitle{
  font-size:52px !important;
}

.pulse{
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.05); }
  100%{ transform:scale(1); }
}

#subText{
  transition:all 1s ease;
}

.photo, video{
  width:90%;
  max-width:400px;
  border-radius:20px;
  margin-top:30px;
  opacity:0;
  transform:translateY(40px);
  transition:all 1s ease;
}

.darkOverlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  opacity:0;
  transition:opacity 1s ease;
  pointer-events:none;
}

.confetti{
  position:absolute;
  font-size:22px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div id="screen1" class="screen">
  <h1>📦 A Special Delivery...</h1>
  <p>To: Kajal</p>
  <p>25 March 2026 • 00:00</p>
  <button onclick="openGift()">Open</button>
</div>

<div id="screen2" class="screen hidden">
  <div class="box" onclick="reveal()">🎁</div>
  <p style="font-size:22px;">Open at your own risk</p>
</div>

<div id="screen3" class="screen hidden">

  <div class="darkOverlay" id="overlay"></div>

  <h1 id="mainTitle" class="glow">Happy Birthday Kajal 🎂</h1>

  <div id="subText">
    <p>Out of 8 billion people...</p>
    <p>25th March chose someone rare.</p>
    <p>And somehow, she chose us too.</p>
    <p style="margin-top:15px;">— Brijesh, Raha & Rishan</p>
  </div>

  <img id="photo" class="photo">
  
  <video id="finalVideo" playsinline muted style="display:none;">
    <source src="final.mp4" type="video/mp4">
  </video>

</div>

<audio id="bgMusic" src="music.mp3" loop></audio>
<audio id="heartbeat" src="heartbeat.mp3"></audio>

<script>

function openGift(){
  document.getElementById("screen1").classList.add("hidden");
  document.getElementById("screen2").classList.remove("hidden");
}

function reveal(){
  document.getElementById("screen2").classList.add("hidden");

  let heartbeat = document.getElementById("heartbeat");
  heartbeat.play();

  setTimeout(()=>{
    document.getElementById("screen3").classList.remove("hidden");
    document.getElementById("bgMusic").volume = 1;
    document.getElementById("bgMusic").play();
    createConfetti();
    startPhotos();
  },2500);
}

function createConfetti(){
  for(let i=0;i<60;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.innerHTML=["🎉","✨","🎊","🎈"][Math.floor(Math.random()*4)];
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

function startPhotos(){

  let photos=[
    "pic1.jpg","pic2.jpg","pic3.jpg","pic4.jpg",
    "pic5.jpg","pic6.jpg","pic7.jpg","pic8.jpg"
  ];

  let img=document.getElementById("photo");
  let index=0;

  function showNext(){
    img.style.opacity="0";
    img.style.transform="translateY(40px)";
    
    setTimeout(()=>{
      img.src=photos[index];
      img.style.display="block";
      img.style.opacity="1";
      img.style.transform="translateY(0)";
      index++;
      if(index < photos.length){
        setTimeout(showNext,3000);
      } else {
        setTimeout(showVideo,3000);
      }
    },400);
  }

  showNext();
}

function showVideo(){

  let img=document.getElementById("photo");
  let video=document.getElementById("finalVideo");
  let subText=document.getElementById("subText");
  let mainTitle=document.getElementById("mainTitle");
  let overlay=document.getElementById("overlay");
  let music=document.getElementById("bgMusic");

  img.style.display="none";

  // Fade out smaller text
  subText.style.opacity="0";
  subText.style.transform="translateY(-20px)";

  // Darken background
  overlay.style.opacity="1";

  // Enlarge & pulse title
  mainTitle.classList.add("bigTitle");
  mainTitle.classList.add("pulse");

  // Lower music volume slightly
  music.volume = 0.5;

  setTimeout(()=>{
    subText.style.display="none";

    video.style.display="block";
    video.style.opacity="1";
    video.style.transform="translateY(0)";
    video.playbackRate = 0.65;
    video.play();

  },1000);
}

</script>

</body>
</html>
