<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>25 March</title>
<style>
body{
  margin:0;
  background:black;
  color:#00ffcc;
  font-family: 'Courier New', monospace;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity 1s ease;
}

.hidden{
  opacity:0;
  pointer-events:none;
}

#terminalText{
  font-size:20px;
  white-space:pre-line;
  max-width:90%;
}

.glow{
  font-size:50px;
  color:white;
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #ff4f81; }
  to{ text-shadow:0 0 40px #ff2e6c; }
}

.stars{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(white 1px, transparent 1px);
  background-size:40px 40px;
  opacity:0.1;
  animation: moveStars 20s linear infinite;
}

@keyframes moveStars{
  from{ background-position:0 0; }
  to{ background-position:0 1000px; }
}

.confetti{
  position:absolute;
  font-size:20px;
  animation: fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

.fadeIn{
  animation: fade 2s ease forwards;
  opacity:0;
}

@keyframes fade{
  to{ opacity:1; }
}
</style>
</head>

<body>

<div id="screen1" class="screen">
  <div id="terminalText"></div>
</div>

<div id="screen2" class="screen hidden">
  <div class="stars"></div>
  <h1 class="glow fadeIn">Happy Birthday Kajal 🎂</h1>
  <p class="fadeIn" style="animation-delay:2s">Out of 8 billion lives...</p>
  <p class="fadeIn" style="animation-delay:4s">25th March chose someone rare.</p>
  <p class="fadeIn" style="animation-delay:6s">And somehow, she chose me too.</p>
  <p class="fadeIn" style="animation-delay:9s; margin-top:30px;">— Brijesh</p>
</div>

<script>

const lines = [
"Initializing universe...",
"Scanning human database...",
"Searching date: 25 March...",
"Match found.",
"Name: Kajal",
"Rarity Level: Unclassified",
"",
"Analyzing uniqueness...",
"",
"Result: LEGENDARY.",
"",
"System Override Initiated..."
];

let i = 0;
let speed = 60;

function typeLine(){
  if(i < lines.length){
    document.getElementById("terminalText").innerHTML += lines[i] + "\n";
    i++;
    setTimeout(typeLine, 800);
  } else {
    setTimeout(()=>{
      document.getElementById("screen1").classList.add("hidden");
      document.getElementById("screen2").classList.remove("hidden");
      createConfetti();
    },2000);
  }
}

function createConfetti(){
  for(let i=0;i<80;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.innerHTML=["🎉","✨","🎊","🎈"][Math.floor(Math.random()*4)];
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+3)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),6000);
  }
}

typeLine();

</script>

</body>
</html>
