<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>25 March</title>

<style>
body{
  margin:0;
  background:#0d0d16;
  color:white;
  font-family:'Segoe UI', sans-serif;
  overflow-x:hidden;
  text-align:center;
}

.screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity 1.2s ease;
  padding:20px;
}

.hidden{
  display:none;
}

h1{
  font-size:32px;
}

button{
  padding:12px 26px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  background:#ff4f81;
  color:white;
  transition:0.3s;
}

button:hover{
  background:#ff2e6c;
}

.box{
  font-size:80px;
  cursor:pointer;
  transition:0.3s;
}
.box:hover{
  transform:scale(1.1);
}

.glow{
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #ff4f81; }
  to{ text-shadow:0 0 40px #ff2e6c; }
}

.confetti{
  position:absolute;
  font-size:20px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

/* Photo Grid */
.photo-container{
  margin-top:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:15px;
  width:100%;
  max-width:600px;
}

.photo{
  width:100%;
  border-radius:15px;
  opacity:0;
  transform:translateY(-50px);
  transition:all 1s ease;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen">
  <h1>📦 A Midnight Delivery...</h1>
  <p>To: Kajal</p>
  <p>25 March • 00:00</p>
  <button onclick="openGift()">Open</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen hidden">
  <div class="box" onclick="reveal()">🎁</div>
  <p>Tap to open</p>
</div>

<!-- SCREEN 3 -->
<div id="screen3" class="screen hidden">
  <h1 class="glow">Happy Birthday Kajal 🎂</h1>
  <p>Out of 8 billion people...</p>
  <p>25th March chose someone rare.</p>
  <p>And somehow, she chose me too.</p>
  <p style="margin-top:20px;">— Brijesh</p>

  <div class="photo-container" id="photoContainer"></div>
</div>

<audio id="bgMusic" src="music.mp3" loop></audio>
<audio id="heartbeat" src="heartbeat.mp3"></audio>

<script>

function openGift(){
  document.getElementById("screen1").classList.add("hidden");
  document.getElementById("screen2").classList.remove("hidden");
}

function reveal(){
  document.getElementById("screen2").classList.add("hidden");

  let heartbeat = document.getElementById("heartbeat");
  heartbeat.play();

  setTimeout(()=>{
    document.getElementById("screen3").classList.remove("hidden");
    document.getElementById("bgMusic").play();
    createConfetti();
    showPhotos();
  },2500);
}

function createConfetti(){
  for(let i=0;i<60;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.innerHTML=["🎉","✨","🎊","🎈"][Math.floor(Math.random()*4)];
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

function showPhotos(){

  let photos=[
    "pic1.jpg","pic2.jpg","pic3.jpg","pic4.jpg",
    "pic5.jpg","pic6.jpg","pic7.jpg","pic8.jpg"
  ];

  let container=document.getElementById("photoContainer");

  photos.forEach((src,i)=>{
    let img=document.createElement("img");
    img.src=src;
    img.className="photo";
    container.appendChild(img);

    setTimeout(()=>{
      img.style.opacity="1";
      img.style.transform="translateY(0)";
    },i*400);
  });
}

</script>

</body>
</html>
